# =====================================================================
# StrattonApp - configuración del backend
# Todas las propiedades admiten variables de entorno (ver docker-compose.yml)
# =====================================================================
spring.application.name=strattonapp
server.port=${APP_PORT:8080}
server.error.whitelabel.enabled=false
server.error.include-message=always

# --- Base de datos (MySQL / MariaDB por defecto) ----------------------
# BBDD_SSL_MODE: DISABLED en local; REQUIRED para bases de datos en la nube (Aiven, Railway...)
# Para PostgreSQL (Render) basta con definir SPRING_DATASOURCE_URL=jdbc:postgresql://host:5432/bd
# junto a DATABASE_USERNAME y DATABASE_PASSWORD: el driver se deduce de la URL.
spring.datasource.url=jdbc:mysql://${BBDD_HOST:localhost}:${BBDD_PORT:3306}/${BBDD_NAME:strattonapp}?createDatabaseIfNotExist=true&sslMode=${BBDD_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}

# --- Hibernate ---------------------------------------------------------
# update: mantiene los datos entre arranques. Usa DDL_AUTO=create para empezar de cero.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# --- Datos de ejemplo ---------------------------------------------------
# SEED_DATA=true crea asesorías, comercializadoras, admin/admin, usuario/usuario y clientes
# de ejemplo SOLO si la base de datos está vacía. SEED_RESET=true la vacía y la vuelve a sembrar.
app.seed.enabled=${SEED_DATA:true}
app.seed.reset=${SEED_RESET:false}

# --- Seguridad ------------------------------------------------------------
# Clave HMAC para firmar los tokens (base64, >= 32 bytes). Genera una con: openssl rand -base64 32
# Si JWT_SECRET está vacío se genera una clave aleatoria en cada arranque (los tokens dejan de
# valer al reiniciar). En producción define SIEMPRE JWT_SECRET.
jwt.secret=${JWT_SECRET:}
# Duración del token en milisegundos (por defecto 10 horas)
jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}
# Permite el auto-registro público en /api/v1/auth/register (false: solo el ADMIN crea empleados)
app.registro-abierto=${REGISTRO_ABIERTO:true}
# Orígenes permitidos para CORS (separados por comas)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost,http://localhost:80,http://127.0.0.1:4200}

# --- Comparador de facturas (público, en la landing) ----------------------------
# Oferta propia: precio único de la energía (€/kWh) y potencia (€/kW·día) en punta y valle
app.comparador.oferta.nombre=${OFERTA_NOMBRE:Tarifa Stratton}
app.comparador.oferta.precio-energia=${OFERTA_PRECIO_ENERGIA:0.10}
app.comparador.oferta.precio-potencia-p1=${OFERTA_PRECIO_POTENCIA_P1:0.09}
app.comparador.oferta.precio-potencia-p2=${OFERTA_PRECIO_POTENCIA_P2:0.09}
# Impuestos vigentes, iguales para la factura actual y la oferta
app.comparador.impuestos.iva=${COMPARADOR_IVA:0.21}
app.comparador.impuestos.impuesto-electrico=${COMPARADOR_IMPUESTO_ELECTRICO:0.0511269632}
app.comparador.impuestos.impuesto-electrico-minimo=0.001
# Lectura de facturas con Claude. Sin ANTHROPIC_API_KEY el cliente introduce los datos a mano.
app.comparador.ia.api-key=${ANTHROPIC_API_KEY:}
app.comparador.ia.modelo=${ANTHROPIC_MODELO:claude-sonnet-5-5}
app.comparador.ia.url=https://api.anthropic.com/v1/messages
app.comparador.max-extracciones-por-hora=${COMPARADOR_MAX_POR_HORA:10}
app.comparador.max-extracciones-totales-por-hora=${COMPARADOR_MAX_TOTAL_POR_HORA:100}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- OpenAPI -----------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- Logging ----------------------------------------------------------------
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.StrattonApp=${APP_LOG_LEVEL:INFO}
