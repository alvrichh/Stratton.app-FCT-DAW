# =====================================================================
# StrattonApp - configuración del backend
# Todas las propiedades admiten variables de entorno (ver docker-compose.yml)
# =====================================================================
spring.application.name=strattonapp
server.port=${APP_PORT:8080}
server.error.whitelabel.enabled=false
server.error.include-message=always

# --- Base de datos (MySQL / MariaDB) ---------------------------------
spring.datasource.url=jdbc:mysql://${BBDD_HOST:localhost}:${BBDD_PORT:3306}/${BBDD_NAME:strattonapp}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Hibernate ---------------------------------------------------------
# update: mantiene los datos entre arranques. Usa DDL_AUTO=create para empezar de cero.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# --- Datos de ejemplo ---------------------------------------------------
# SEED_DATA=true crea asesorías, comercializadoras, admin/admin, usuario/usuario y clientes
# de ejemplo SOLO si la base de datos está vacía. SEED_RESET=true la vacía y la vuelve a sembrar.
app.seed.enabled=${SEED_DATA:true}
app.seed.reset=${SEED_RESET:false}

# --- Seguridad ------------------------------------------------------------
# Clave HMAC (base64, >= 256 bits). Cámbiala en producción con JWT_SECRET.
jwt.secret=${JWT_SECRET:G5pE3i4e0A1vUN/z0MutEqgxlbLLXgX+QEV8HDlyH1E=}
# Duración del token en milisegundos (por defecto 10 horas)
jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}
# Orígenes permitidos para CORS (separados por comas)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost,http://localhost:80,http://127.0.0.1:4200}

# --- OpenAPI -----------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- Logging ----------------------------------------------------------------
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.StrattonApp=${APP_LOG_LEVEL:INFO}
