# Los tests usan H2 en memoria: no necesitan MySQL
spring.datasource.url=jdbc:h2:mem:strattonapp-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
app.seed.enabled=true
app.seed.reset=true
jwt.secret=dGVzdC1zZWNyZXQta2V5LXBhcmEtc3RyYXR0b25hcHAtMzJieXRlcw==
jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:4200
logging.level.root=WARN
# Comparador de facturas: oferta de prueba e impuestos vigentes
app.comparador.oferta.nombre=Tarifa Stratton
app.comparador.oferta.precio-energia=0.10
app.comparador.oferta.precio-potencia-p1=0.09
app.comparador.oferta.precio-potencia-p2=0.09
app.comparador.impuestos.iva=0.21
app.comparador.impuestos.impuesto-electrico=0.0511269632
app.comparador.impuestos.impuesto-electrico-minimo=0.001
