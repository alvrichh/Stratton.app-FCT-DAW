# Los tests usan H2 en memoria: no necesitan MySQL
spring.datasource.url=jdbc:h2:mem:strattonapp-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
app.seed.enabled=true
app.seed.reset=true
jwt.secret=REPLACE_WITH_YOUR_OWN_BASE64_SECRET
jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:4200
logging.level.root=WARN
