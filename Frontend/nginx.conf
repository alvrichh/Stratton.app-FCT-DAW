# Configuración principal de nginx. El servidor (SPA + proxy a la API) está en
# templates/default.conf.template: la imagen oficial de nginx sustituye en él las variables
# de entorno (${PORT}, ${BACKEND_URL}) al arrancar y lo deja en /etc/nginx/conf.d/.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
