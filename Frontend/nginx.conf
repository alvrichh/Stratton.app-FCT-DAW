# Configuración de nginx para servir la SPA de Angular y hacer de proxy a la API.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Nombre del servicio del backend en docker-compose.yml
    upstream backend {
        server strattonapp_back:8080;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Proxy de la API hacia el backend (misma URL de origen: sin problemas de CORS)
        location ^~ /api/ {
            proxy_pass http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Documentación de la API (Swagger UI)
        # (^~ evita que la location de estáticos por extensión capture los .js/.css de Swagger)
        location ^~ /swagger-ui/ { proxy_pass http://backend/swagger-ui/; }
        location = /swagger-ui.html { proxy_pass http://backend/swagger-ui.html; }
        location ^~ /v3/api-docs { proxy_pass http://backend/v3/api-docs; }

        # Fallback SPA: cualquier ruta de Angular devuelve index.html.
        # index.html no se guarda en caché: así el navegador siempre carga la última versión
        # (los JS/CSS que referencia llevan un hash en el nombre y sí pueden cachearse).
        location / {
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }

        # JS y CSS generados por Angular (nombre con hash): inmutables, caché de un año
        location ~* "-[A-Z0-9]{8}\.(js|css)$" {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Resto de estáticos (imágenes, vídeo, fuentes) sin hash: caché de un día
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|mp4)$ {
            add_header Cache-Control "public, max-age=86400";
            try_files $uri =404;
        }
    }
}
