# Configuración de nginx para servir la SPA de Angular y hacer de proxy a la API.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Nombre del servicio del backend en docker-compose.yml
    upstream backend {
        server strattonapp_back:8080;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Proxy de la API hacia el backend (misma URL de origen: sin problemas de CORS)
        location /api/ {
            proxy_pass http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Documentación de la API (Swagger UI)
        location /swagger-ui/ { proxy_pass http://backend/swagger-ui/; }
        location = /swagger-ui.html { proxy_pass http://backend/swagger-ui.html; }
        location /v3/api-docs { proxy_pass http://backend/v3/api-docs; }

        # Fallback SPA: cualquier ruta de Angular devuelve index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Caché larga para los assets con hash
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|mp4)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri =404;
        }
    }
}
