<footer class="pie" aria-labelledby="pie-titulo">
  <div class="container-xl">
    <h2 id="pie-titulo" class="visually-hidden">Información de StrattonApp</h2>

    <div class="principal">
      <div class="marca">
        <img src="assets/images/StrattonAPPlogo2.png" alt="StrattonApp" width="71" height="30">
        <ul class="redes" aria-label="Redes sociales">
          <li><a href="https://github.com/alvrichh" target="_blank" rel="noopener" aria-label="GitHub"><i class="bi bi-github" aria-hidden="true"></i></a></li>
          <li><a href="https://www.linkedin.com/in/álvaro-rodriguez-molina-613651202" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="bi bi-linkedin" aria-hidden="true"></i></a></li>
          <li><a href="https://wa.link/44bcfa" target="_blank" rel="noopener" aria-label="WhatsApp"><i class="bi bi-whatsapp" aria-hidden="true"></i></a></li>
        </ul>
      </div>

      <nav aria-label="Enlaces del pie">
        <ul class="enlaces">
          <li><a routerLink="/">Presentación</a></li>
          <li><a routerLink="/inicio">Comercializadoras</a></li>
          <li><a routerLink="/clientes">Clientes</a></li>
          <li><a routerLink="/login">Iniciar sesión</a></li>
        </ul>
      </nav>

      <form (ngSubmit)="suscribirse()" class="newsletter" aria-label="Suscripción a la newsletter">
        <label for="newsletter-email" class="visually-hidden">Correo electrónico para la newsletter</label>
        <input id="newsletter-email" type="email" class="form-control form-control-sm" placeholder="Newsletter: tu@correo.com"
          name="email" [(ngModel)]="email" required autocomplete="email">
        <button class="btn btn-primary btn-sm flex-none" type="submit">Suscribirme</button>
      </form>
    </div>

    <div class="legal">
      <span>© {{ anio }} Álvaro Rodríguez Molina · TFG 2º DAW · IES Alixar</span>
      <a href="https://creativecommons.org/public-domain/cc0/" target="_blank" rel="noopener" class="cc">
        <img src="assets/images/CC.png" alt="" height="16">
        <span>Licencia Creative Commons</span>
      </a>
    </div>
  </div>
</footer>
