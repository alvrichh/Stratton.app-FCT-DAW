<header class="header sticky-top">
  <nav class="navbar navbar-expand-md navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" routerLink="/inicio">
        <img src="assets/images/StrattonAPPlogo2.png" alt="StrattonApp" class="logo">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Mostrar menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a routerLink="/inicio" routerLinkActive="active" class="nav-link" data-bs-toggle="collapse" data-bs-target="#navbarNav.show"><i class="bi bi-house"></i> Inicio</a>
          </li>
          <li *ngIf="authService.isLoggedIn()" class="nav-item">
            <a routerLink="/clientes" routerLinkActive="active" class="nav-link" data-bs-toggle="collapse" data-bs-target="#navbarNav.show"><i class="bi bi-people"></i> Clientes</a>
          </li>
          <li *ngIf="authService.isLoggedIn()" class="nav-item">
            <a routerLink="/registrar-cliente" routerLinkActive="active" class="nav-link" data-bs-toggle="collapse" data-bs-target="#navbarNav.show"><i class="bi bi-person-plus"></i> Nuevo cliente</a>
          </li>
          <li *ngIf="authService.isAdmin()" class="nav-item">
            <a routerLink="/empleados" routerLinkActive="active" class="nav-link" data-bs-toggle="collapse" data-bs-target="#navbarNav.show"><i class="bi bi-headset"></i> Empleados</a>
          </li>
          <li *ngIf="authService.isAdmin()" class="nav-item">
            <a routerLink="/registrar-empleado" routerLinkActive="active" class="nav-link" data-bs-toggle="collapse" data-bs-target="#navbarNav.show"><i class="bi bi-person-badge"></i> Nuevo empleado</a>
          </li>
        </ul>
        <ul class="navbar-nav">
          <ng-container *ngIf="authService.isLoggedIn(); else loginLink">
            <li class="nav-item">
              <a routerLink="/perfil" routerLinkActive="active" class="nav-link" data-bs-toggle="collapse" data-bs-target="#navbarNav.show">
                <i class="bi bi-person-circle"></i> {{ authService.getNombre() }}
                <span class="badge bg-secondary ms-1">{{ authService.getMainRole() }}</span>
              </a>
            </li>
            <li class="nav-item">
              <button type="button" (click)="logout()" class="logout-btn nav-link btn btn-link text-decoration-none"><i class="bi bi-power"></i> Cerrar sesión</button>
            </li>
          </ng-container>
          <ng-template #loginLink>
            <li class="nav-item">
              <a routerLink="/login" routerLinkActive="active" class="nav-link" data-bs-toggle="collapse" data-bs-target="#navbarNav.show"><i class="bi bi-box-arrow-in-right"></i> Iniciar sesión</a>
            </li>
          </ng-template>
        </ul>
      </div>
    </div>
  </nav>
</header>
