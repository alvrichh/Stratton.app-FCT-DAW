<div class="container-xl">
  <a [routerLink]="['/detalles-cliente', id]" class="volver"><i class="bi bi-arrow-left" aria-hidden="true"></i> Volver al cliente</a>
  <header class="page-header pt-3">
    <div>
      <h1>Editar cliente</h1>
      <p class="subtitulo" *ngIf="original">{{ original.nombre }} {{ original.apellidos }} · {{ original.dni }}</p>
    </div>
  </header>
  <div class="card form-card">
    <div class="card-body p-4">
      <app-cliente-form *ngIf="cliente; else cargando" [cliente]="cliente" [modoEdicion]="true" [guardando]="guardando"
        (guardar)="onGuardar($event)" (cancelar)="volver()"></app-cliente-form>
      <ng-template #cargando>
        <div aria-busy="true"><span class="skeleton mb-3"></span><span class="skeleton mb-3"></span><span class="skeleton"></span></div>
      </ng-template>
    </div>
  </div>
</div>
