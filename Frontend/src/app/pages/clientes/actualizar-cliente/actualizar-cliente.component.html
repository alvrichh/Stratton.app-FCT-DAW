<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-lg-9">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h3 class="mb-0"><i class="bi bi-pencil-square"></i> Editar cliente<span *ngIf="original">: {{ original.nombre }} {{ original.apellidos }}</span></h3>
          <a *ngIf="original" [routerLink]="['/detalles-cliente', id]" class="btn btn-outline-secondary btn-sm"><i class="bi bi-eye"></i> Ver detalle</a>
        </div>
        <div class="card-body">
          <app-cliente-form *ngIf="cliente; else cargando" [cliente]="cliente" [modoEdicion]="true" [guardando]="guardando"
            (guardar)="onGuardar($event)" (cancelar)="volver()"></app-cliente-form>
          <ng-template #cargando>
            <div class="text-center py-4"><div class="spinner-border" role="status"><span class="visually-hidden">Cargando...</span></div></div>
          </ng-template>
        </div>
      </div>
    </div>
  </div>
</div>
