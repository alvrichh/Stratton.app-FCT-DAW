<div class="container-xl">
  <a routerLink="/clientes" class="volver"><i class="bi bi-arrow-left" aria-hidden="true"></i> Clientes</a>
  <header class="page-header pt-3">
    <div>
      <h1>Nuevo cliente</h1>
      <p class="subtitulo">Registra sus datos y, si ya lo tienes, su primer punto de suministro.</p>
    </div>
  </header>
  <div class="card form-card">
    <div class="card-body p-4">
      <app-cliente-form [cliente]="cliente" [guardando]="guardando" (guardar)="guardarCliente($event)" (cancelar)="volver()"></app-cliente-form>
    </div>
  </div>
</div>
