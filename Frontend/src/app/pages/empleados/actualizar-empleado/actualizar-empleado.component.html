<div class="container-xl">
  <a [routerLink]="['/detalles-empleado', id]" class="volver"><i class="bi bi-arrow-left" aria-hidden="true"></i> Volver al empleado</a>
  <header class="page-header pt-3">
    <div>
      <h1>Editar empleado</h1>
      <p class="subtitulo" *ngIf="original">{{ original.nombre }} {{ original.apellidos }} · {{ original.username }}</p>
    </div>
  </header>
  <div class="card form-card">
    <div class="card-body p-4">
      <app-empleado-form *ngIf="empleado; else cargando" [empleado]="empleado" [modoEdicion]="true" [guardando]="guardando"
        (guardar)="actualizarEmpleado($event)" (cancelar)="volver()"></app-empleado-form>
      <ng-template #cargando>
        <div aria-busy="true"><span class="skeleton mb-3"></span><span class="skeleton mb-3"></span><span class="skeleton"></span></div>
      </ng-template>
    </div>
  </div>
</div>
