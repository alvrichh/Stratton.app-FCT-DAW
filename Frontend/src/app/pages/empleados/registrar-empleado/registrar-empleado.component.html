<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card">
        <div class="card-header">
          <h3 class="text-center mb-0"><i class="bi bi-person-badge"></i> Registro de empleado</h3>
        </div>
        <div class="card-body">
          <app-empleado-form [empleado]="empleado" [guardando]="guardando" (guardar)="guardarEmpleado($event)" (cancelar)="volver()"></app-empleado-form>
        </div>
      </div>
    </div>
  </div>
</div>
