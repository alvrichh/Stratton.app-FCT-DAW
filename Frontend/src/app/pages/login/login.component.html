<div class="container" role="main">
  <div class="row justify-content-center">
    <div class="col-md-6 text-center">
      <img src="assets/images/StrattonAPPlogo2.png" alt="Logo de StrattonApp" class="img-fluid mb-4 app">
      <div class="card" aria-labelledby="login-heading">
        <div class="card-header">
          <h1 id="login-heading" class="text-center h3 mb-0">Iniciar sesión</h1>
        </div>
        <div class="card-body text-start">
          <div *ngIf="sesionExpirada" class="alert alert-warning py-2">Tu sesión ha caducado. Vuelve a iniciar sesión.</div>
          <form (ngSubmit)="login()" #loginForm="ngForm" appEnterNext>
            <div class="mb-3">
              <label for="username" class="form-label">Usuario</label>
              <input type="text" class="form-control" id="username" placeholder="Introduce tu usuario"
                [(ngModel)]="username" name="username" required autocomplete="username" autofocus>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="password" placeholder="Introduce tu contraseña"
                [(ngModel)]="password" name="password" required autocomplete="current-password">
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary" [disabled]="!loginForm.valid || cargando">
                <span *ngIf="cargando" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
                Iniciar sesión
              </button>
            </div>
          </form>
          <p class="mt-3 mb-0 text-center">¿No tienes cuenta?
            <a routerLink="/register" aria-label="Registrarse">Regístrate</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
