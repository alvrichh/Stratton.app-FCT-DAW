<div class="auth-wrap">
  <div class="auth-card card">
    <div class="card-body">
      <div class="auth-marca">
        <span class="auth-logo"><img src="assets/images/StrattonAPPlogo2.png" alt="" width="104" height="44"></span>
        <h1 id="login-heading" class="h3 mb-1">Bienvenido de nuevo</h1>
        <p class="text-secondary mb-0">Accede a tu cartera de clientes.</p>
      </div>

      <div *ngIf="sesionExpirada" class="alert alert-warning d-flex gap-2 align-items-center py-2" role="status">
        <i class="bi bi-clock-history" aria-hidden="true"></i> Tu sesión ha caducado. Vuelve a iniciar sesión.
      </div>

      <form (ngSubmit)="login()" #loginForm="ngForm" appEnterNext aria-labelledby="login-heading">
        <div class="mb-3">
          <label for="username" class="form-label">Usuario</label>
          <input type="text" class="form-control" id="username" placeholder="tu.usuario"
            [(ngModel)]="username" name="username" required autocomplete="username" #usernameInput>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-group">
            <input [type]="mostrarPassword ? 'text' : 'password'" class="form-control" id="password" placeholder="••••••••"
              [(ngModel)]="password" name="password" required autocomplete="current-password">
            <button type="button" class="btn btn-outline-secondary" (click)="mostrarPassword = !mostrarPassword"
              [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'" [attr.aria-pressed]="mostrarPassword">
              <i class="bi" [class.bi-eye]="!mostrarPassword" [class.bi-eye-slash]="mostrarPassword" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="!loginForm.valid || cargando">
          <span *ngIf="cargando" class="spinner-border spinner-border-sm" aria-hidden="true"></span>
          {{ cargando ? 'Entrando…' : 'Iniciar sesión' }}
        </button>
      </form>

      <p class="auth-pie">¿No tienes cuenta? <a routerLink="/register">Crea una</a></p>
    </div>
  </div>
</div>
