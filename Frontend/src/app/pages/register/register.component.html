<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 text-center">
      <img src="assets/images/arsyncbw.png" alt="ARSync" class="img-fluid mb-4" style="max-width: 60%;">
      <div class="card">
        <div class="card-header">
          <h1 class="text-center h3 mb-0">Registro</h1>
        </div>
        <div class="card-body text-start">
          <form (ngSubmit)="register()" #registerForm="ngForm" appEnterNext>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" [(ngModel)]="datos.nombre"
                  name="nombre" required maxlength="60" #nombre="ngModel">
                <div class="form-text text-warning" *ngIf="nombre.invalid && nombre.touched">El nombre es obligatorio.</div>
              </div>
              <div class="col-md-6 mb-3">
                <label for="apellidos" class="form-label">Apellidos</label>
                <input type="text" class="form-control" id="apellidos" placeholder="Tus apellidos"
                  [(ngModel)]="datos.apellidos" name="apellidos" required maxlength="80" #apellidos="ngModel">
                <div class="form-text text-warning" *ngIf="apellidos.invalid && apellidos.touched">Los apellidos son obligatorios.</div>
              </div>
            </div>
            <div class="mb-3">
              <label for="username" class="form-label">Usuario</label>
              <input type="text" class="form-control" id="username" placeholder="Nombre de usuario (3-20 caracteres)"
                [(ngModel)]="datos.username" name="username" required minlength="3" maxlength="20" autocomplete="username" #username="ngModel">
              <div class="form-text text-warning" *ngIf="username.invalid && username.touched">El usuario debe tener entre 3 y 20 caracteres.</div>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" id="email" placeholder="tu@correo.com" [(ngModel)]="datos.email"
                name="email" required email autocomplete="email" #email="ngModel">
              <div class="form-text text-warning" *ngIf="email.invalid && email.touched">Introduce un correo válido.</div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" placeholder="Mínimo 6 caracteres"
                  [(ngModel)]="datos.password" name="password" required minlength="6" autocomplete="new-password" #password="ngModel">
                <div class="form-text text-warning" *ngIf="password.invalid && password.touched">Mínimo 6 caracteres.</div>
              </div>
              <div class="col-md-6 mb-3">
                <label for="confirmPassword" class="form-label">Repite la contraseña</label>
                <input type="password" class="form-control" id="confirmPassword" placeholder="Repite la contraseña"
                  [(ngModel)]="confirmPassword" name="confirmPassword" required autocomplete="new-password" #confirm="ngModel">
                <div class="form-text text-warning" *ngIf="confirm.touched && !passwordsCoinciden">Las contraseñas no coinciden.</div>
              </div>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary" [disabled]="!registerForm.valid || !passwordsCoinciden || cargando">
                <span *ngIf="cargando" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
                Registrarse
              </button>
            </div>
          </form>
          <p class="mt-3 mb-0 text-center">¿Ya tienes una cuenta?
            <a routerLink="/login">Iniciar sesión</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
