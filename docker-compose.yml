# Despliegue completo de StrattonApp: base de datos + backend + frontend.
#   docker compose up --build
# Frontend: http://localhost        API: http://localhost/api        Swagger: http://localhost/swagger-ui.html
services:
  db:
    image: mysql:8.0
    container_name: strattonapp-bbdd
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:-stratton}
      MYSQL_DATABASE: ${BBDD_NAME:-strattonapp}
      TZ: Europe/Madrid
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DATABASE_PASSWORD:-stratton}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  strattonapp_back:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: strattonapp_back
    restart: unless-stopped
    environment:
      BBDD_HOST: db
      BBDD_PORT: 3306
      BBDD_NAME: ${BBDD_NAME:-strattonapp}
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-stratton}
      APP_PORT: 8080
      DDL_AUTO: ${DDL_AUTO:-update}
      SEED_DATA: ${SEED_DATA:-true}
      SEED_RESET: ${SEED_RESET:-false}
      JWT_SECRET: ${JWT_SECRET:-G5pE3i4e0A1vUN/z0MutEqgxlbLLXgX+QEV8HDlyH1E=}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:4200}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  strattonapp_front:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: strattonapp_front
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - strattonapp_back

volumes:
  db_data:
