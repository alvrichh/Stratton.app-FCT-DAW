# Blueprint de Render: PostgreSQL, backend (Spring Boot) y frontend (Angular + nginx) como servicios Docker.
# En local se sigue usando MySQL (docker compose); en Render el backend se conecta a PostgreSQL
# a través de SPRING_DATASOURCE_URL (el driver se deduce de la URL).
# Uso: Render > New > Blueprint > este repositorio.
databases:
  - name: strattonapp-db
    plan: free
    databaseName: strattonapp
    user: strattonapp

services:
  - type: web
    name: strattonapp-back
    runtime: docker
    plan: free
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    envVars:
      - key: APP_PORT
        value: "8080"
      - key: PORT
        value: "8080"
      # URL JDBC de la base de datos: jdbc:postgresql://<host interno>:5432/strattonapp
      # (Render la da como postgresql://...; hay que anteponer "jdbc:" y quitar usuario y contraseña)
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: DATABASE_USERNAME
        fromDatabase:
          name: strattonapp-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: strattonapp-db
          property: password
      - key: DDL_AUTO
        value: update
      - key: SEED_DATA
        value: "true"
      # Clave aleatoria generada por Render: los tokens siguen valiendo tras reiniciar
      - key: JWT_SECRET
        generateValue: true
      - key: REGISTRO_ABIERTO
        value: "false"
      # URL pública del frontend (cámbiala si Render le asigna otra)
      - key: CORS_ALLOWED_ORIGINS
        value: https://strattonapp-front.onrender.com
      # El plan gratuito tiene 512 MB de RAM
      - key: JAVA_OPTS
        value: "-Xms64m -Xmx300m -XX:+UseSerialGC -Xss512k"

  - type: web
    name: strattonapp-front
    runtime: docker
    plan: free
    dockerfilePath: ./Frontend/Dockerfile
    dockerContext: ./Frontend
    envVars:
      # URL pública del backend (cámbiala si Render le asigna otra)
      - key: BACKEND_URL
        value: https://strattonapp-back.onrender.com
