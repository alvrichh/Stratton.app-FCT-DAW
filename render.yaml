# Blueprint de Render: PostgreSQL, backend (Spring Boot, Docker) y frontend (Angular, sitio estático).
# En local se sigue usando MySQL y nginx (docker compose); en Render el backend se conecta a PostgreSQL
# a través de SPRING_DATASOURCE_URL (el driver se deduce de la URL).
# Uso: Render > New > Blueprint > este repositorio.
databases:
  - name: strattonapp-db
    plan: free
    databaseName: strattonapp
    user: strattonapp

services:
  - type: web
    name: strattonapp-back
    runtime: docker
    plan: free
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    envVars:
      - key: APP_PORT
        value: "8080"
      - key: PORT
        value: "8080"
      # URL JDBC de la base de datos: jdbc:postgresql://<host interno>:5432/strattonapp
      # (Render la da como postgresql://...; hay que anteponer "jdbc:" y quitar usuario y contraseña)
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: DATABASE_USERNAME
        fromDatabase:
          name: strattonapp-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: strattonapp-db
          property: password
      - key: DDL_AUTO
        value: update
      - key: SEED_DATA
        value: "true"
      # Clave aleatoria generada por Render: los tokens siguen valiendo tras reiniciar
      - key: JWT_SECRET
        generateValue: true
      - key: REGISTRO_ABIERTO
        value: "false"
      # URL pública del frontend (cámbiala si Render le asigna otra)
      - key: CORS_ALLOWED_ORIGINS
        value: https://strattonapp-front.onrender.com
      # El plan gratuito tiene 512 MB de RAM
      - key: JAVA_OPTS
        value: "-Xms64m -Xmx300m -XX:+UseSerialGC -Xss512k"

  # Frontend como sitio estático: no se duerme nunca, así que carga al instante y es la propia
  # aplicación la que muestra la pantalla de espera mientras el backend gratuito despierta.
  # Llama directamente al backend (ver src/environments/environment.render.ts y CORS_ALLOWED_ORIGINS).
  - type: web
    name: strattonapp-front
    runtime: static
    rootDir: Frontend
    buildCommand: npm ci --no-audit --no-fund && npm run build:render
    staticPublishPath: dist/strattonapp-front/browser
    envVars:
      - key: NODE_VERSION
        value: "20"
    headers:
      # index.html sin caché: el navegador siempre carga la última versión
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /
        name: Cache-Control
        value: no-cache
    routes:
      - type: redirect
        source: /swagger-ui.html
        destination: https://strattonapp-back.onrender.com/swagger-ui.html
      # Fallback SPA: cualquier ruta de Angular devuelve index.html
      - type: rewrite
        source: /*
        destination: /index.html
